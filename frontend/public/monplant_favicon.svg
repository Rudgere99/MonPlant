  <ellipse cx="795" cy="520" rx="360" ry="360" fill="url(#glowGreen)" filter="url(#softBlur)" opacity="0.95"/>
  <ellipse cx="455" cy="360" rx="280" ry="250" fill="#0f9dd3" filter="url(#softBlur)" opacity="0.28"/>

