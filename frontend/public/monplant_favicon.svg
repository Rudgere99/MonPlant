<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glowBlue" cx="28%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#0f4fb3"/>
      <stop offset="45%" stop-color="#083a93"/>
      <stop offset="100%" stop-color="#041f63"/>
    </radialGradient>

    <radialGradient id="glowGreen" cx="82%" cy="56%" r="58%">
      <stop offset="0%" stop-color="#37e05d"/>
      <stop offset="55%" stop-color="#12b84c"/>
      <stop offset="100%" stop-color="#047a33"/>
    </radialGradient>

    <linearGradient id="bgBlend" x1="8%" y1="8%" x2="88%" y2="88%">
